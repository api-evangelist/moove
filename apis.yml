name: Moove
description: 'Moove is a mobility fintech providing revenue-based vehicle financing and ownership
  programs that let drivers acquire cars, motorcycles, and trucks and build businesses on ride-sharing
  and delivery partner platforms. Applicants apply to Moove, get verified, and start driving toward
  owning their vehicle, typically within days. Moove partners with major manufacturers including
  Hyundai, Toyota, Tesla, Volkswagen, and Bajaj, and centers its model on financial inclusion, gender
  equality, and a hybrid/EV fleet transition. Backed by DCM Ventures and Speedinvest. Moove publishes
  no public developer API, SDKs, or API documentation at this time; this profile captures the
  company''s public identity and probed domain-security posture.'
